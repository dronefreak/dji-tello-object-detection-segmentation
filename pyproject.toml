[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dji-tello-object-detection-segmentation"
version = "2.0.0"
description = "Modern instance segmentation and object detection for DJI Tello drones"
readme = ".github/README.md"
requires-python = ">=3.10"
authors = [
    {name = "Saumya Saksena", email = "kumaar324@gmail.com"}
]
keywords = ["drone", "computer-vision", "segmentation", "object-detection", "tello"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "djitellopy>=2.5.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pyyaml>=6.0",
    "pynput>=1.7.6",
]

[project.optional-dependencies]
detectron2 = [
    # Note: Install manually after torch is installed
    # pip install 'git+https://github.com/facebookresearch/detectron2.git'
]
yolo = [
    "ultralytics>=8.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/dronefreak/dji-tello-object-detection-segmentation"
Repository = "https://github.com/dronefreak/dji-tello-object-detection-segmentation"
Issues = "https://github.com/dronefreak/dji-tello-object-detection-segmentation/issues"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Unit tests that don't require external dependencies",
    "integration: Integration tests that may require external services",
    "slow: Tests that take a long time to run",
    "drone: Tests that require an actual Tello drone",
    "gpu: Tests that require GPU",
]

[tool.coverage.run]
source = ["tello_vision"]
omit = [
    "*/tests/*",
    "*/examples/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]