[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tello_vision*"]

[project]
name = "dji-tello-object-detection-segmentation"
version = "2.0.0"
description = "Modern instance segmentation and object detection for DJI Tello drones"
readme = ".github/README.md"
requires-python = ">=3.10"
authors = [
    {name = "Saumya Saksena", email = "kumaar324@gmail.com"}
]
keywords = ["drone", "computer-vision", "segmentation", "object-detection", "tello"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "djitellopy>=2.5.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pyyaml>=6.0",
    "pynput>=1.7.6",
]

[project.optional-dependencies]
# Detectron2 is intentionally NOT listed here as an installable extra:
# it isn't a normal PyPI package and must be installed manually via git
# after torch is present (see README "Installation" and "Troubleshooting"
# sections), e.g.:
#   pip install 'git+https://github.com/facebookresearch/detectron2.git'
yolo = [
    "ultralytics>=8.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/dronefreak/dji-tello-object-detection-segmentation"
Repository = "https://github.com/dronefreak/dji-tello-object-detection-segmentation"
Issues = "https://github.com/dronefreak/dji-tello-object-detection-segmentation/issues"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["tello_vision", "examples", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "D", "PLR", "I"]
extend-ignore = [
    "E203",   # Black-compatible slice formatting
    "D203",   # Google style: no blank line before class (keep D211)
    "D212",   # Google style: multi-line summary on second line (keep D213)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D100", "D101", "D102",  # No docstring requirements in tests
    "S101",                  # allow assert
    "S602",                  # shell=True in subprocess (tests only)
    "PLR2004",               # Magic values in assertions are normal
    "PLR0913",               # @patch decorators add mock args to signatures
    "PLR0917",               # Same - too many positional args from @patch
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# Test functions take untyped fixture/mock arguments (pytest, pytest-mock)
# that aren't worth annotating individually; still type-checked otherwise.
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Unit tests that don't require external dependencies",
    "integration: Integration tests that may require external services",
    "slow: Tests that take a long time to run",
    "drone: Tests that require an actual Tello drone",
    "gpu: Tests that require GPU",
]

[tool.coverage.run]
source = ["tello_vision"]
omit = [
    "*/tests/*",
    "*/examples/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]