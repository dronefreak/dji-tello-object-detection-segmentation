# Note: pre-commit ignores anything already ignored by Git.
repos:
  # 1. Ruff: lint + format + import-sort + docstring checks (replaces
  # isort, black, flake8, pep8-naming, docformatter)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  # 2. mypy: static type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        name: mypy (deep scan)
        files: ^(tello_vision|tests|examples)/
        args:
          - --ignore-missing-imports
          - --no-error-summary
          - --pretty
        additional_dependencies:
          - types-PyYAML

  # 3. pre-commit hooks for safety
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=2500"]
      - id: check-docstring-first
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: detect-private-key

  # 4. prettier for markdown/yaml/json/xml/toml
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [markdown, yaml, json, xml, toml]

  # 5. clang-format for C/C++ files
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v16.0.6
    hooks:
      - id: clang-format
        files: '\.(cpp|cxx|cc|hpp|hxx|hh)$'
        exclude: "third_party|generated"
